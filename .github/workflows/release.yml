name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o showheaders-linux-amd64 ./cmd/showheaders
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o showheaders-linux-arm64 ./cmd/showheaders
          
          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o showheaders-darwin-amd64 ./cmd/showheaders
          
          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o showheaders-darwin-arm64 ./cmd/showheaders
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o showheaders-windows-amd64.exe ./cmd/showheaders

      - name: Create checksums
        run: |
          sha256sum showheaders-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            showheaders-*
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
